# syscheck defaults. Shipped with the program and REPLACED on every upgrade.
#
# Do not edit this file. Change settings with `syscheck settings` or
# `syscheck set <name> <value>`, which write /etc/syscheck/syscheck.conf.
# That file is read after this one, belongs to this machine only, and is never
# touched by an upgrade.

# --- schedule -----------------------------------------------------------------
# Master switch for the scheduled run, and the time it runs every day (24h).
SC_ENABLED=on
SC_SCHEDULE=05:00

# --- Claude analysis ----------------------------------------------------------
# off = collect and apply the threshold rules only; Claude is never called.
SC_ANALYSIS=on

# Which Claude model reviews the logs. 'sonnet' is the sensible default:
# roughly 20-50 cents a run. 'opus' reasons better about strange hardware
# symptoms but costs several times more. A full model id also works.
SC_MODEL=sonnet
SC_EFFORT=high

# Hard ceiling on the analysis stage, in seconds. Claude normally finishes in a
# few minutes; this exists so a hung session cannot run all morning.
SC_CLAUDE_TIMEOUT=3600

# Spend cap per run, enforced by the Claude CLI itself.
SC_MAX_BUDGET_USD=2.00

# --- machine ------------------------------------------------------------------
# The account that owns the Claude login and the desktop audio session.
# Empty = the first ordinary login account on this machine.
SC_USER=

# The disk to interrogate. Empty = the disk that holds the root filesystem.
SC_DISK=

# Services whose journal errors are read every run (missing ones are skipped).
# Empty = a built-in list of common server daemons.
SC_WATCH_SERVICES=

# --- alarm and banner ---------------------------------------------------------
# Sound an audible alarm when a fault looks imminent, and for how long.
SC_ALARM=on
SC_ALARM_SECONDS=600

# Show the result on the SSH login banner (MOTD).
SC_MOTD=on

# --- retention ----------------------------------------------------------------
# How many runs to keep on disk.
SC_KEEP_RUNS=45

# Furthest back the journal scan will reach, in days. Normally the window is
# "since the previous successful run". This caps it so a stretch of failed runs
# cannot make each run scan the entire journal.
SC_MAX_LOOKBACK_DAYS=7

# --- two-tier logging ---------------------------------------------------------
# Claude reads the capped NN-*.log views; the complete output of every probe is
# archived (gzipped) under each run's full/ directory and read only on demand.
# A probe producing more than SC_LOG_MAX_LINES is shown as head+tail in the
# capped view, with a marker naming the archive file.
SC_LOG_MAX_LINES=120
SC_LOG_HEAD=40
SC_LOG_TAIL=60

# Backstop on the archive itself, so one runaway probe cannot fill the disk.
SC_FULL_MAX_LINES=20000

# --- upgrades -----------------------------------------------------------------
# Where `syscheck upgrade` looks for releases. Only release files are
# downloaded; nothing about this machine is sent.
SC_REPO=masterunix/syscheck
